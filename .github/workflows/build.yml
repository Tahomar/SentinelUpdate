name: Build Fyne GUI EXE (Compressed + Icon)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Setup MSYS2 (Обязательно для графики Fyne)
      uses: msys2/setup-msys2@v2
      with:
        install: gcc
        release: false

    - name: Compile Fyne GUI with Icon
      shell: bash
      run: |
        go mod init sentinel-tool
        go mod tidy
        
        # Скачиваем утилиту для иконки
        go install github.com/akavel/rsrc@latest
        
        # Зашиваем ТОЛЬКО иконку (без манифеста, чтобы UPX ничего не сломал)
        # Убедитесь, что файл app.ico лежит в репозитории!
        rsrc -ico app.ico -o rsrc.syso
        
        # Собираем легкий EXE без консоли
        go build -ldflags="-s -w -H=windowsgui" -o SentinelMigration.exe main.go

    - name: Compress with UPX
      run: |
        choco install upx
        # Экстремальное сжатие файла
        upx --best --lzma SentinelMigration.exe

    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: Sentinel-Executable-Tiny
        path: SentinelMigration.exe
