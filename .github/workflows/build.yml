name: Build Fyne GUI EXE (Official PNG Packager)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Setup MSYS2 (Required for Fyne CGO)
      uses: msys2/setup-msys2@v2
      with:
        install: gcc
        release: false

    - name: Compile and Package with Fyne CLI
      shell: bash
      run: |
        go mod init sentinel-tool
        go mod tidy
        
        # 1. Скачиваем официальный инструмент автоматизации Fyne
        go install fyne.io/fyne/v2/cmd/fyne@latest
        
        # 2. Собираем проект. Флаг -icon теперь принимает обычный PNG!
        fyne package -os windows -icon app.png -name SentinelMigration.exe

    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: Sentinel-Executable-Release
        path: SentinelMigration.exe
