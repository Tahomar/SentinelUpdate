name: Build C# Windows EXE (All Versions)

on:
  push:
    branches: [ "csharp-version" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Compile Lightweight App (75 KB)
      run: |
        # Собираем легкую версию без платформы внутри
        dotnet publish SentinelTool.csproj -c Release -r win-x64 -p:PublishSingleFile=true --self-contained false -o output_light

    - name: Compile Tank App (60 MB)
      run: |
        # Собираем тяжелую бессмертную версию с платформой и сжатием
        dotnet publish SentinelTool.csproj -c Release -r win-x64 -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true --self-contained true -o output_tank

    - name: Upload Lightweight EXE
      uses: actions/upload-artifact@v4
      with:
        name: Sentinel-CSharp-Lightweight
        path: output_light\SentinelTool.exe

    - name: Upload Tank EXE
      uses: actions/upload-artifact@v4
      with:
        name: Sentinel-CSharp-Tank
        path: output_tank\SentinelTool.exe
