name: Build Win32 GUI EXE

on:
  push:
    branches: [ "main", "fyne-version" ] # Робот будет собирать из любой ветки
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Compile Win32 GUI
      shell: bash
      run: |
        go mod init sentinel-tool
        go mod tidy
        
        # 1. Скачиваем утилиту для упаковки ресурсов (манифестов)
        go install github.com/akavel/rsrc@latest
        
        # 2. Создаем файл манифеста (чтобы кнопки выглядели современно, а не как в Win 95)
        echo '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><assembly xmlns="urn:schemas-microsoft-com:asm.v1" manifestVersion="1.0"><assemblyIdentity version="1.0.0.0" processorArchitecture="*" name="App" type="win32"/><dependency><dependentAssembly><assemblyIdentity type="win32" name="Microsoft.Windows.Common-Controls" version="6.0.0.0" processorArchitecture="*" publicKeyToken="6595b64144ccf1df" language="*"/></dependentAssembly></dependency></assembly>' > app.manifest
        
        # 3. Упаковываем манифест в формат .syso (Go автоматически подхватит его при сборке)
        rsrc -manifest app.manifest -o rsrc.syso
        
        # 4. Собираем легкий EXE
        go build -ldflags="-s -w -H=windowsgui" -o SentinelConverter-Win32.exe main.go

    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: Sentinel-Win32-Executable
        path: SentinelConverter-Win32.exe
